# Runs the agent's own automated tests (unit + browser integration).
# Manual only: open the Actions tab, choose "Run Tests" and click "Run workflow".
name: Run Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Browser integration tests
        run: npm run test:integration
